name: otserver-otter-lab

services:
  siemens:
    build:
      context: .
      dockerfile: devices/Dockerfile.siemens
    cap_add: [NET_RAW]
    healthcheck: &process-health
      test: [CMD-SHELL, "kill -0 1"]
      interval: 1s
      timeout: 1s
      retries: 20
    networks:
      ot_lab:
        ipv4_address: 172.30.0.10
        mac_address: "02:00:00:00:00:10"

  ethernet_ip:
    build:
      context: .
      dockerfile: devices/Dockerfile.opener
    cap_add: [NET_RAW]
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.11
        mac_address: "02:00:00:00:00:11"

  bacnet:
    build:
      context: .
      dockerfile: devices/Dockerfile.bacnet
    environment:
      BACNET_IFACE: eth0
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.12
        mac_address: "02:00:00:00:00:12"

  fins:
    build:
      context: .
      dockerfile: devices/Dockerfile.responders
    command: [fins]
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.13
        mac_address: "02:00:00:00:00:13"

  fox:
    build:
      context: .
      dockerfile: devices/Dockerfile.responders
    command: [fox]
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.14
        mac_address: "02:00:00:00:00:14"

  dnp3:
    build:
      context: .
      dockerfile: devices/Dockerfile.responders
    command: [dnp3]
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.16
        mac_address: "02:00:00:00:00:16"

  iec61850:
    build:
      context: .
      dockerfile: devices/Dockerfile.iec61850
    healthcheck: *process-health
    networks:
      ot_lab:
        ipv4_address: 172.30.0.17
        mac_address: "02:00:00:00:00:17"

  opcua:
    build:
      context: .
      dockerfile: devices/Dockerfile.opcua
    # asyncua needs several seconds to bind 4840; wait for the socket, not just the process.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4840), 2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      ot_lab:
        ipv4_address: 172.30.0.15
        mac_address: "02:00:00:00:00:15"

  test:
    build:
      context: ..
      dockerfile: lab/Dockerfile.otter
    cap_add: [NET_RAW]
    depends_on:
      siemens: { condition: service_healthy }
      ethernet_ip: { condition: service_healthy }
      bacnet: { condition: service_healthy }
      fins: { condition: service_healthy }
      fox: { condition: service_healthy }
      dnp3: { condition: service_healthy }
      iec61850: { condition: service_healthy }
      opcua: { condition: service_healthy }
    volumes:
      - ./artifacts:/artifacts:Z
    networks:
      ot_lab:
        ipv4_address: 172.30.0.2
        mac_address: "02:00:00:00:00:02"

networks:
  ot_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
