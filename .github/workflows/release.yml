name: Release Otter

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: rustup component add rustfmt clippy
      - run: cargo fmt -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ./lab/test.sh

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo build --locked --release
      - run: ./target/release/otserver-otter --version
      - run: tar czf otserver-otter-linux-x86_64.tar.gz -C target/release otserver-otter
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-linux-x86_64
          path: otserver-otter-linux-x86_64.tar.gz

  build-linux-arm64:
    needs: verify
    runs-on: ubuntu-24.04-arm
    container: rust:1.89-bookworm
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo build --locked --release --no-default-features
      - run: ./target/release/otserver-otter --version
      - run: tar czf otserver-otter-linux-aarch64.tar.gz -C target/release otserver-otter
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-linux-aarch64
          path: otserver-otter-linux-aarch64.tar.gz

  build-windows:
    needs: verify
    runs-on: windows-latest
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: .\target\release\otserver-otter.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-windows-x86_64
          path: target/release/otserver-otter.exe

  provenance-subjects:
    needs: [build-linux, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Hash release artifacts
        id: hashes
        run: |
          set -euo pipefail
          mv artifacts/otserver-otter-linux-x86_64/otserver-otter-linux-x86_64.tar.gz .
          mv artifacts/otserver-otter-linux-aarch64/otserver-otter-linux-aarch64.tar.gz .
          mv artifacts/otserver-otter-windows-x86_64/otserver-otter.exe .
          echo "hashes=$(sha256sum otserver-otter-linux-x86_64.tar.gz otserver-otter-linux-aarch64.tar.gz otserver-otter.exe | base64 -w0)" >> "$GITHUB_OUTPUT"

  release:
    needs: [build-linux, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: |
          mv artifacts/otserver-otter-linux-x86_64/otserver-otter-linux-x86_64.tar.gz .
          mv artifacts/otserver-otter-linux-aarch64/otserver-otter-linux-aarch64.tar.gz .
          mv artifacts/otserver-otter-windows-x86_64/otserver-otter.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            otserver-otter-linux-x86_64.tar.gz
            otserver-otter-linux-aarch64.tar.gz
            otserver-otter.exe
          generate_release_notes: true

  provenance:
    needs: [provenance-subjects, release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.provenance-subjects.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
