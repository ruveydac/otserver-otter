name: Release Otter

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: rustup component add rustfmt clippy
      - run: cargo fmt -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ./lab/test.sh

  controller:
    needs: verify
    uses: ./.github/workflows/controller.yml
    with:
      management_ref: ${{ vars.OTTER_MANAGEMENT_REF }}

  build-linux:
    needs: [verify, controller]
    runs-on: ubuntu-latest
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo build --locked --release
      - run: ./target/release/otserver-otter --version
      - run: tar czf otserver-otter-linux-x86_64.tar.gz -C target/release otserver-otter
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-linux-x86_64
          path: otserver-otter-linux-x86_64.tar.gz

  build-linux-arm64:
    needs: [verify, controller]
    runs-on: ubuntu-24.04-arm
    container: rust:1.89-bookworm
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo build --locked --release --no-default-features
      - run: ./target/release/otserver-otter --version
      - run: tar czf otserver-otter-linux-aarch64.tar.gz -C target/release otserver-otter
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-linux-aarch64
          path: otserver-otter-linux-aarch64.tar.gz

  build-windows:
    needs: [verify, controller]
    runs-on: windows-latest
    env:
      OTTER_BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: .\target\release\otserver-otter.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-otter-windows-x86_64
          path: target/release/otserver-otter.exe

  sign-release:
    needs: [build-linux, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release signer before accessing the signing secret
        run: cargo build --locked --no-default-features --example sign-update
      - uses: actions/download-artifact@v5
        with:
          pattern: otserver-otter-*
          merge-multiple: true
          path: release-artifacts
      - name: Unpack executables for embedded signing
        run: |
          mkdir -p release-artifacts/linux-x86_64 release-artifacts/linux-aarch64
          tar xzf release-artifacts/otserver-otter-linux-x86_64.tar.gz -C release-artifacts/linux-x86_64
          tar xzf release-artifacts/otserver-otter-linux-aarch64.tar.gz -C release-artifacts/linux-aarch64
      - name: Embed and verify executable signatures
        env:
          OTTER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTER_UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ./target/debug/examples/sign-update "$RELEASE_VERSION" x86_64-unknown-linux-gnu release-artifacts/linux-x86_64/otserver-otter
          ./target/debug/examples/sign-update "$RELEASE_VERSION" aarch64-unknown-linux-gnu release-artifacts/linux-aarch64/otserver-otter
          ./target/debug/examples/sign-update "$RELEASE_VERSION" x86_64-pc-windows-msvc release-artifacts/otserver-otter.exe
      - name: Package signed Linux executables
        run: |
          tar czf release-artifacts/otserver-otter-linux-x86_64.tar.gz -C release-artifacts/linux-x86_64 otserver-otter
          tar czf release-artifacts/otserver-otter-linux-aarch64.tar.gz -C release-artifacts/linux-aarch64 otserver-otter
      - uses: actions/upload-artifact@v7
        with:
          name: otter-signed-release
          if-no-files-found: error
          path: |
            release-artifacts/otserver-otter-linux-x86_64.tar.gz
            release-artifacts/otserver-otter-linux-aarch64.tar.gz
            release-artifacts/otserver-otter.exe

  verify-signed-binaries:
    needs: sign-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: otserver-otter-linux-x86_64
            archive: otserver-otter-linux-x86_64.tar.gz
            executable: otserver-otter
          - os: ubuntu-24.04-arm
            artifact: otserver-otter-linux-aarch64
            archive: otserver-otter-linux-aarch64.tar.gz
            executable: otserver-otter
          - os: windows-latest
            artifact: otserver-otter-windows-x86_64
            archive: ''
            executable: otserver-otter.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: unsigned
      - uses: actions/download-artifact@v5
        with:
          name: otter-signed-release
          path: signed
      - name: Verify with the original build and smoke-test the signed executable
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXECUTABLE: ${{ matrix.executable }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir trusted candidate
          if [[ -n "$ARCHIVE" ]]; then
            tar xzf "unsigned/$ARCHIVE" -C trusted
            tar xzf "signed/$ARCHIVE" -C candidate
            chmod +x "trusted/$EXECUTABLE" "candidate/$EXECUTABLE"
          else
            cp "unsigned/$EXECUTABLE" "trusted/$EXECUTABLE"
            cp "signed/$EXECUTABLE" "candidate/$EXECUTABLE"
          fi
          "trusted/$EXECUTABLE" verify-binary "candidate/$EXECUTABLE"
          actual=$("candidate/$EXECUTABLE" --version)
          test "$actual" = "otserver-otter $RELEASE_VERSION"

  provenance-subjects:
    needs: verify-signed-binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: otter-signed-release
      - name: Hash release artifacts
        id: hashes
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum otserver-otter-linux-x86_64.tar.gz otserver-otter-linux-aarch64.tar.gz otserver-otter.exe | base64 -w0)" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-signed-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: otter-signed-release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            otserver-otter-linux-x86_64.tar.gz
            otserver-otter-linux-aarch64.tar.gz
            otserver-otter.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  provenance:
    needs: [provenance-subjects, release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.provenance-subjects.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
