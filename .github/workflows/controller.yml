name: Remote management integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      management_ref:
        description: 'Full management commit SHA for a paired change (defaults to the tested baseline)'
        type: string
        required: false
  workflow_call:
    inputs:
      management_ref:
        description: 'Full management commit SHA (defaults to the tested baseline)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  controller:
    name: Full remote management
    # MongoDB 8 cannot start on Linux 6.19+ (SERVER-121912).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MANAGEMENT_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.management_ref || '3fe070fa6811bf4d7baf823f9a7547d0b0e9966d' }}
    steps:
      - name: Require a reproducible management revision
        if: github.event_name != 'schedule'
        run: '[[ "$MANAGEMENT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout OTserver management
        uses: actions/checkout@v6
        with:
          repository: ruveydac/OTserver
          ref: ${{ env.MANAGEMENT_REF }}
          path: management
          persist-credentials: false
      - name: Initialize OTserver metadata submodule
        run: git -C management submodule update --init --depth=1 otserver-metadata
      - name: Checkout the Otter revision under test
        uses: actions/checkout@v6
        with:
          path: management/otserver-otter
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: management/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: management/pnpm-lock.yaml
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev openssl
      - name: Install management dependencies
        working-directory: management
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run Otter controller integration gate
        env:
          OTTER_MANAGEMENT_SKIP_UI: '1'
        run: ./management/otserver-otter/lab/test-controller.sh
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: otter-controller-integration
          path: management/otserver-otter/lab/artifacts/controller.*/
          if-no-files-found: ignore
          retention-days: 7
